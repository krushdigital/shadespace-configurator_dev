name: 🔁 Sync to Org Repo

on:
  push:
    branches:
      - dev
      - bolt-ai-playground
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🔐 Push to Org Repo
        env:
          TOKEN: ${{ secrets.SYNC_TO_ORG_PAT }}
        run: |
          git remote add org https://x-access-token:${TOKEN}@github.com/KRUSH-Digital/shadespace-configurator_dev.git
          git push org dev --force
