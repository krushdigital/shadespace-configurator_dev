name: Synced dev extension

on:
  push:
    branches:
      - bolt-ai-playground

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout shadespace-configurator-dev (current repo)
        uses: actions/checkout@v4
        with:
          ref: bolt-ai-playground

      - name: Clone shadespace-configurator-prod
        run: |
          git clone https://x-access-token:${{ secrets.PROD_GIT_TOKEN }}@github.com/KRUSH-Digital/shadespace-configurator_prod.git ../shadespace-configurator-prod

      - name: Copy files from shadespace-configurator-dev to shadespace-configurator-prod
        run: |
          rsync -av --exclude='.git' --exclude='.github' ./ ../shadespace-configurator-prod/shade_space

      - name: Commit and Push changes to shadespace-configurator-prod
        run: |
          cd ../shadespace-configurator-prod
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extension changes from shadespace-configurator-dev" || echo "No changes to commit"
          git push origin main